<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DERVS</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Marcas em L nos quatro cantos — referência de HUD/mira (design.md). -->
  <div class="cantos" aria-hidden="true">
    <span class="canto canto-tl"></span>
    <span class="canto canto-tr"></span>
    <span class="canto canto-bl"></span>
    <span class="canto canto-br"></span>
  </div>

  <header class="topo">
    <p class="relogio" id="relogio" aria-label="Hora atual">--:--:--</p>
    <h1 class="nome">DERVS</h1>
    <p class="data" id="data-atual" aria-label="Data de hoje"></p>
  </header>

  <!-- Liga/desliga da escuta. Escondido até o Python dizer em que estado o
       microfone está — nunca chuta "ligado" antes de saber. -->
  <button type="button" id="botao-microfone" class="botao-microfone" aria-pressed="false" hidden>
    <span class="microfone-ponto" aria-hidden="true"></span>
    <span id="botao-microfone-texto">Microfone</span>
  </button>

  <main class="hud">
    <p class="rotulo-estado" id="rotulo-estado"></p>
    <div class="nucleo-area">
      <canvas id="canvas" width="320" height="320" aria-label="Núcleo do DERVS"></canvas>
      <p class="leitura-tecnica" id="leitura-amp">AMP 0.00</p>
    </div>
  </main>

  <!-- Painel de sistema — dado real desta máquina (dervs_sistema.py), não
       decoração. Some sozinho (hidden) enquanto nenhuma leitura chegou —
       nunca mostra "0%" inventado antes do primeiro dado real. -->
  <section class="paineis-sistema" id="paineis-sistema" aria-label="Estado desta máquina" hidden>
    <div class="painel-dado">
      <span class="painel-dado-rotulo">CPU</span>
      <span class="painel-dado-valor" id="sistema-cpu">--%</span>
    </div>
    <div class="painel-dado">
      <span class="painel-dado-rotulo">RAM</span>
      <span class="painel-dado-valor" id="sistema-ram">--%</span>
    </div>
    <div class="painel-dado">
      <span class="painel-dado-rotulo">DISCO</span>
      <span class="painel-dado-valor" id="sistema-disco">-- / -- GB</span>
    </div>
  </section>

  <section class="conversa" id="conversa" aria-live="polite">
    <p class="fala fala-dono" id="fala-dono" hidden>
      <span class="fala-rotulo">você</span>
      <span class="fala-texto" id="fala-dono-texto"></span>
    </p>
    <p class="fala fala-dervs" id="fala-dervs" hidden>
      <span class="fala-rotulo">DERVS</span>
      <span class="fala-texto" id="fala-dervs-texto"></span>
    </p>
  </section>

  <section class="cartao cartao-erro" id="cartao-erro" hidden>
    <svg class="icone-erro" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="24" cy="24" r="20" fill="none" stroke="#FF3B3B" stroke-width="2.5" stroke-dasharray="6 4"/>
      <rect x="22" y="14" width="4" height="16" fill="#FF3B3B"/>
      <rect x="22" y="33" width="4" height="4" fill="#FF3B3B"/>
    </svg>
    <div class="cartao-erro-texto">
      <p class="cartao-erro-frase" id="cartao-erro-frase"></p>
      <p class="cartao-erro-apoio" id="cartao-erro-apoio" hidden></p>
    </div>
  </section>

  <section class="cartao cartao-plano" id="cartao-plano" hidden>
    <p class="cartao-plano-pergunta" id="cartao-plano-pergunta"></p>
    <ul class="cartao-plano-passos" id="cartao-plano-passos"></ul>
    <p class="cartao-plano-comando" id="cartao-plano-comando" hidden></p>
    <label class="cartao-plano-autorizacao" id="cartao-plano-autorizacao-envolucro" hidden>
      <input type="checkbox" id="cartao-plano-autorizacao-caixa">
      <span id="cartao-plano-autorizacao-texto"></span>
    </label>
    <div class="cartao-plano-botoes">
      <button type="button" id="botao-confirmar" class="botao botao-confirmar">Confirmar</button>
      <button type="button" id="botao-cancelar" class="botao botao-cancelar">Cancelar</button>
    </div>
  </section>

  <!-- Fase 1 da esteira dervs-painel-completo: só ABRE a URL no navegador
       (main.js, shell.openExternal) — nenhuma outra integração com o outro
       projeto (login, comando, cofre) existe nesta entrega. -->
  <button type="button" id="botao-abrir-app-dervs" class="botao botao-abrir-app-dervs">
    Abrir DERVS App
  </button>

  <script src="hud.js"></script>
</body>
</html>
