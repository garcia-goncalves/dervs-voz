[pytest]
# --import-mode=importlib: sem isto, dois arquivos de teste com o MESMO nome em
# pastas diferentes (por exemplo test_dervs_safety.py aqui e outro dentro de uma
# copia de trabalho em .claude/worktrees/) fazem o pytest abortar a coleta
# inteira com "import file mismatch" — nenhum teste roda, nem os bons.
# Aconteceu em 01/09/2026, com tres agentes trabalhando em copias paralelas.
addopts = --import-mode=importlib

# Nao procurar teste dentro do ambiente Python, das copias de trabalho dos
# agentes, nem das amostras geradas.
norecursedirs = dervs-venv .venv *-venv .claude .git amostras_voz __pycache__

testpaths = .
