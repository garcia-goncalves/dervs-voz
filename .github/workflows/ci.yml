name: CI

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # O DERVS é um programa de Windows (PyQt, microfone, PowerShell): o runner
  # tem de ser Windows. Windows custa 2x na cota de Actions, então a CI roda
  # só o teste unitário, sem e2e, e um job só.
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
